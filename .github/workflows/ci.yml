name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Integration tests use Testcontainers to run a real MySQL container via Docker.
      # GitHub-hosted ubuntu-latest runners have Docker pre-installed and running, so no
      # extra setup is needed here (unlike local Docker-via-Colima, see README).
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
